//==========【基础设置】==========
sv_cheats 1;                       // 作弊模式（开）
mp_restartgame 1;                  // 1秒后重新开始游戏
mp_humanteam any;                  // 随意选择阵营
mp_limitteams 0;                   // CT和T的人数差限制（关）
mp_autoteambalance 0;              // 自动平衡人数（关）
mp_forcecamera 0;                  // 限制观察者观看队伍（关）
mp_spectators_max 9;               // 观察者最大人数（9人）
cl_versus_intro 0;                 // 开局阵营展示过场动画（关）
mp_team_intro_time 0;              // 开局阵营展示时间（0秒）
sv_alltalk 1;                      // 双方队伍语音互通（开）
sv_deadtalk 1;                     // 死亡后允许说话（开）
mp_autokick 0;                     // 自动踢人（关）

//==========【回合设置】==========
mp_roundtime_defuse 60;            // 每局时间（60分钟）
mp_maxrounds 100;                  // 最大局数（100局）
mp_warmup_end;                     // 结束热身时间
mp_freezetime 1;                   // 冻结时间（1秒）
mp_ignore_round_win_conditions 1;  // 忽略胜利条件（开）
mp_round_restart_delay 0;          // 每回合结束等待时间（0秒）

//==========【经济系统】==========
mp_startmoney 99999;               // 初始金钱（99999$）
mp_maxmoney 99999;                 // 最大金钱（99999$）
mp_buytime 99999;                  // 购买时间（99999）
mp_buy_anywhere 1;                 // 随处购买（开）

//==========【死亡与重生】==========
mp_respawn_immunitytime 0;         // 重生保护时间（0秒）
mp_respawn_on_death_ct 1;          // CT死亡后复活（开）
mp_respawn_on_death_t 1;           // T死亡后复活（开）
mp_respawnwavetime_ct 0;           // CT复活延迟（0秒）
mp_respawnwavetime_t 0;            // T复活延迟（0秒）

//==========【BOT管理】==========
bot_join_after_player 1;           // BOT在玩家后加入（开）
bot_chatter off;                   // 关闭BOT语音
bot_kick;                          // 踢出BOT
bot_stop 1;                        // 禁止BOT移动（开）
bot_dont_shoot 1;                  // 禁止BOT开枪（开）

//==========【武器与弹药】==========
sv_infinite_ammo 1;                // 无限子弹（开）
mp_drop_knife_enable 1;            // 允许丢刀（开）
mp_free_armor 2;                   // 开局带全甲（开）
mp_weapons_allow_typecount -1;     // 同一回合允许重复购买同一种武器
mp_death_drop_gun 1;               // 角色死亡后掉落武器（开）
mp_death_drop_grenade 0;           // 角色死亡后掉落投掷物（关）
mp_death_drop_defuser 0;           // 角色死亡后掉落拆弹器（关）

//==========【投掷物设置】==========
ammo_grenade_limit_total 999;      // 携带投掷物总数量（999）
ammo_grenade_limit_default 2;      // 默认单类投掷物携带数量（2）
sv_grenade_trajectory_prac_trailtime 5; // 投掷物轨迹滞留时间（5秒）
sv_grenade_trajectory_prac_pipreview 1; // 左下角投掷物预测窗口（开）
mp_friendlyfire 0;                 // 友军伤害（关）
sv_falldamage_scale 1;              // 坠落伤害倍率（1倍）
sv_regeneration_force_on 1;        // 自动回血（开）

//==========【C4设置】==========
mp_anyone_can_pickup_c4 0;         // 所有人可捡包（关）
mp_plant_c4_anywhere 0;            // 任意地点下包（关）

//==========【CT默认装备】==========
mp_ct_default_primary weapon_m4a1_silencer;       // CT默认主武器
mp_ct_default_secondary weapon_usp_silencer;     // CT默认副武器
mp_ct_default_grenades weapon_hegrenade weapon_incgrenade weapon_smokegrenade weapon_flashbang weapon_decoy; // CT开局自带投掷物

//==========【T默认装备】==========
mp_t_default_primary weapon_ak47;                // T默认主武器
mp_t_default_secondary weapon_usp_silencer;      // T默认副武器
mp_t_default_grenades weapon_hegrenade weapon_molotov weapon_smokegrenade weapon_flashbang weapon_decoy; // T开局自带投掷物

//==========【帮助按钮 F8 - 控制台输出】==========
alias "help_1" "echo \"=====【跑图按键帮助】=====\""
alias "help_2" "echo \"【F8】：显示本帮助\""
alias "help_3" "echo \"【-】：添加T BOT | 【=】：添加CT BOT\""
alias "help_4" "echo \"【n】：放置BOT | 【反斜杠键】：BOT蹲下/站立\""
alias "help_5" "echo \"【，】：重复投掷物 | 【.】：消除投掷物效果\""
alias "help_6" "echo \"【/】：显示X光\""
alias "help_7" "echo \"【F9】：生成蝴蝶刀（subclass_create 515）\""
alias "help_8" "echo \"【刀模型】刺刀500 海豹503 折叠505 穿肠506 爪子507\""
alias "help_9" "echo \"M9 508 猎杀509 弯刀512 鲍伊514 蝴蝶515 暗影516\""
alias "help_10" "echo \"系绳517 求生518 熊刀519 折刀520 流浪521 短剑522\""
alias "help_11" "echo \"锯齿523 骷髅525 廓尔喀526 | 用法：subclass_create 507\""
alias "help_say" "help_1; help_2; help_3; help_4; help_5; help_6; help_7; help_8; help_9; help_10; help_11"
bind "F8" help_say

//==========【跑图快捷键 + 执行提示】==========
bind "," "pwa_rethrow_last_grenade; sv_rethrow_last_grenade; say \"已执行：重复上一个投掷物\""
bind "." "pwa_kill_smokegrenade; ent_fire smokegrenade_projectile kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill; ent_fire decoy_projectile kill; ent_fire inferno kill; say \"已执行：消除投掷物效果\""
bind "F9" "subclass_create 507; say \"已执行：生成爪子刀\""

bind "-" "bot_add t; pwa_bot_add; bot_place; say \"已执行：添加T BOT并放置\""
bind "=" "bot_add ct; pwa_bot_add; bot_place; say \"已执行：添加CT BOT并放置\""
bind "n" "bot_place; say \"已执行：在准星处放置BOT\""

bind "\\" "toggle bot_crouch 0 1; say \"已执行：切换BOT蹲下/站立\""

bind "/" "cl_ent_viewoffset; say \"已执行：显示X光\""